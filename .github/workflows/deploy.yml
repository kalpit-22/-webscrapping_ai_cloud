name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

env:
  REGISTRY_LOGIN_SERVER: pradhyumnagentregistry.azurecr.io
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  RESOURCE_GROUP: ResearchAgentRG
  NEXT_PUBLIC_API_URL: https://agent-web.livelystone-d34cd2e4.centralindia.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and Push Web API
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/agent-web:latest .
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/agent-web:latest

      - name: Build and Push Worker
        run: |
          docker build -t ${{ env.REGISTRY_LOGIN_SERVER }}/agent-worker:latest -f Dockerfile.worker .
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/agent-worker:latest

      - name: Build and Push Frontend
        working-directory: ./frontend
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} -t ${{ env.REGISTRY_LOGIN_SERVER }}/agent-frontend:latest .
          docker push ${{ env.REGISTRY_LOGIN_SERVER }}/agent-frontend:latest

      - name: Update Azure Container Apps
        run: |
          az containerapp update --name agent-web --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/agent-web:latest
          az containerapp update --name agent-worker --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/agent-worker:latest
          az containerapp update --name agent-frontend --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY_LOGIN_SERVER }}/agent-frontend:latest
