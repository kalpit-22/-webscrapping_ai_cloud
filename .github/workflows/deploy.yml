name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

env:
  REGISTRY_LOGIN_SERVER: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  RESOURCE_GROUP: ResearchAgentRG
  NEXT_PUBLIC_API_URL: https://agent-web.livelystone-d34cd2e4.centralindia.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and Push Web API
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/agent-web:latest .
          docker push ${{ env.IMAGE_PREFIX }}/agent-web:latest

      - name: Build and Push Worker
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}/agent-worker:latest -f Dockerfile.worker .
          docker push ${{ env.IMAGE_PREFIX }}/agent-worker:latest

      - name: Build and Push Frontend
        working-directory: ./frontend
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} -t ${{ env.IMAGE_PREFIX }}/agent-frontend:latest .
          docker push ${{ env.IMAGE_PREFIX }}/agent-frontend:latest

      - name: Update Azure Container Apps (Scale to Zero)
        run: |
          az containerapp update --name agent-web --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.IMAGE_PREFIX }}/agent-web:latest --min-replicas 0
          az containerapp update --name agent-worker --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.IMAGE_PREFIX }}/agent-worker:latest --min-replicas 0
          az containerapp update --name agent-frontend --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.IMAGE_PREFIX }}/agent-frontend:latest --min-replicas 0
