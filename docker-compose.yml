services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - redis
      - mongo
    command: uvicorn api:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - redis
      - mongo
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=4

volumes:
  redis_data:
  mongo_data:
